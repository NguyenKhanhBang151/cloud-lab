version: '3.8'

services:
  backend:
    image: nguyenkhanhbang/mern-backend:1.0
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/.env

  frontend:
    image: nguyenkhanhbang/mern-frontend:2.0
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend